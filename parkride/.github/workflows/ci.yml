name: ParkRide CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Jac Type Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jaclang & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Jac Version
        run: |
          jac --version

      - name: Type Check Core Graph Models & Walkers
        working-directory: ./parkride
        run: |
          jac check core/models/nodes.jac
          jac check core/models/edges.jac
          jac check core/lib/clock.jac
          jac check core/lib/qr_sign.jac
          jac check core/lib/allocation.jac
          jac check core/lib/forecast.jac
          jac check core/lib/dijkstra.jac

      - name: Run Core Test Suite
        working-directory: ./parkride
        run: |
          jac test tests/test_core.jac -v

      - name: Test Python Helper Utility
        working-directory: ./parkride
        run: |
          python scripts/jac_share.py data
          python scripts/jac_share.py token --booking-id "ci_test_01"
