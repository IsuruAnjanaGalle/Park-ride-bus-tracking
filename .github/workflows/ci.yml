name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core:
    name: jac check, jac test, jac share
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install jac 0.37.25
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash -s -- --version 0.37.25
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Jac version
        run: jac --version

      - name: Jac share (>= 85%)
        run: python3 scripts/jac_share.py

      - name: jac check (whole project)
        run: jac check

      - name: jac test
        run: jac test
