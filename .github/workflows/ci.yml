name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core:
    name: jac check, jac test, jac share
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jaclang & Dependencies jac 0.37.25
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Jac Version
        run: |
          jac --version

      - name: Type Check Core Graph Models & Walkers
        working-directory: ./parkride
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash -s -- --version 0.37.25
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Jac version
        run: jac --version

      - name: Jac share (>= 85%)
        run: python3 scripts/jac_share.py

      - name: jac check (whole project)
        run: jac check

      - name: jac test
        run: jac test
