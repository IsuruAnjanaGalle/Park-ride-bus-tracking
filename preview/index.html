<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park & Ride Sri Lanka — UI Kit & Component Preview</title>
  <meta name="description" content="Interactive Design System & UI Kit Preview for Park & Ride Sri Lanka passenger app.">
  
  <!-- Typography from SOW: Schibsted Grotesk & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Schibsted Grotesk"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
          colors: {
            brand: {
              yellow: '#FFC21A',
              navy: '#0F1B2D',
              dark: '#080D1A',
              surface: '#111A29',
              r1: '#2563EB',
              r2: '#7C3AED',
              r3: '#0D9488',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for Live In-Browser Execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Schibsted Grotesk', sans-serif;
      background-color: #080D1A;
      color: #FFFFFF;
      overflow-x: hidden;
    }
    
    @keyframes pulseSlow {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.1); opacity: 0.25; }
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .shimmer-active {
      animation: shimmer 1.8s infinite;
    }

    .animate-glow {
      animation: pulseSlow 4s ease-in-out infinite;
    }

    .transit-grid {
      background-image: radial-gradient(circle at 50% 50%, #FFC21A 1px, transparent 1px), radial-gradient(circle at 50% 50%, #2563EB 1px, transparent 1px);
      background-size: 48px 48px, 96px 96px;
      background-position: 0 0, 24px 24px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 27, 45, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 194, 26, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 194, 26, 0.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. Button Component ---
    function Button({ label, onClick, variant = "primary", size = "md", disabled = false, fullWidth = false, icon = null }) {
      const baseCls = "inline-flex items-center justify-center font-semibold rounded-xl transition-all duration-200 cursor-pointer select-none active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 min-h-[44px]";
      
      const varCls = variant === "primary" ? "bg-[#FFC21A] text-[#0F1B2D] hover:bg-[#e5ad16] shadow-md shadow-[#FFC21A]/20"
        : variant === "secondary" ? "bg-[#0F1B2D] text-white hover:bg-[#1A2C42] border border-white/10"
        : variant === "glass" ? "bg-white/10 text-white backdrop-blur-md hover:bg-white/20 border border-white/20"
        : variant === "ghost" ? "bg-transparent text-gray-400 hover:text-white hover:bg-white/5"
        : variant === "danger" ? "bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30"
        : "bg-[#FFC21A] text-[#0F1B2D]";

      const szCls = size === "sm" ? "px-3 py-1.5 text-xs"
        : size === "lg" ? "px-6 py-3 text-base"
        : "px-4 py-2.5 text-sm";

      const widthCls = fullWidth ? "w-full" : "";
      const cls = `${baseCls} ${varCls} ${szCls} ${widthCls}`.trim();

      return (
        <button className={cls} onClick={onClick} disabled={disabled}>
          {icon && <span className="mr-2 inline-flex items-center">{icon}</span>}
          <span>{label}</span>
        </button>
      );
    }

    // --- 2. IconButton Component ---
    function IconButton({ icon, ariaLabel, onClick, variant = "ghost", size = "md", disabled = false, badge = "" }) {
      const baseCls = "relative inline-flex items-center justify-center rounded-xl transition-all duration-200 cursor-pointer select-none active:scale-90 disabled:opacity-50 disabled:cursor-not-allowed min-w-[44px] min-h-[44px]";

      const varCls = variant === "primary" ? "bg-[#FFC21A] text-[#0F1B2D] hover:bg-[#e5ad16] shadow-md shadow-[#FFC21A]/20"
        : variant === "secondary" ? "bg-[#0F1B2D] text-white hover:bg-[#1A2C42] border border-white/10"
        : variant === "glass" ? "bg-white/10 text-white backdrop-blur-md hover:bg-white/20 border border-white/20"
        : "bg-transparent text-gray-300 hover:text-white hover:bg-white/10";

      const szCls = size === "sm" ? "w-10 h-10 text-sm"
        : size === "lg" ? "w-14 h-14 text-xl"
        : "w-11 h-11 text-base";

      return (
        <button className={`${baseCls} ${varCls} ${szCls}`} aria-label={ariaLabel} title={ariaLabel} onClick={onClick} disabled={disabled}>
          <span className="inline-flex items-center justify-center">{icon}</span>
          {badge && (
            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm animate-pulse">
              {badge}
            </span>
          )}
        </button>
      );
    }

    // --- 3. GlassCard Component ---
    function GlassCard({ children, className = "", variant = "default", padding = "md", onClick = null }) {
      const baseCls = "rounded-2xl backdrop-blur-xl border transition-all duration-300 relative overflow-hidden";

      const varCls = variant === "default" ? "bg-[#0F1B2D]/70 border-white/10 shadow-xl shadow-black/30"
        : variant === "glow" ? "bg-[#0F1B2D]/85 border-[#FFC21A]/30 shadow-2xl shadow-[#FFC21A]/10 ring-1 ring-[#FFC21A]/20"
        : variant === "light" ? "bg-white/10 border-white/20 shadow-lg text-white"
        : variant === "sunken" ? "bg-[#0B1220]/90 border-white/5 shadow-inner"
        : variant === "accent" ? "bg-gradient-to-br from-[#0F1B2D]/90 to-[#1E293B]/80 border-blue-500/20"
        : "bg-[#0F1B2D]/70 border-white/10";

      const padCls = padding === "none" ? "p-0" : padding === "sm" ? "p-3" : padding === "lg" ? "p-6" : "p-4";
      const hoverCls = onClick ? "hover:border-white/25 hover:translate-y-[-2px] cursor-pointer" : "";

      return (
        <div className={`${baseCls} ${varCls} ${padCls} ${hoverCls} ${className}`} onClick={onClick}>
          <div className="absolute -top-12 -right-12 w-32 h-32 bg-white/5 rounded-full blur-2xl pointer-events-none" />
          <div className="relative z-10">{children}</div>
        </div>
      );
    }

    // --- 4. Tilt Component ---
    function Tilt({ children, className = "", maxTilt = 10.0, onClick = null }) {
      const [tilt, setTilt] = useState({ x: 0, y: 0 });
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const xPercent = (x / rect.width) * 2 - 1;
        const yPercent = (y / rect.height) * 2 - 1;
        setTilt({ x: -yPercent * 8, y: xPercent * 8 });
      };

      const handleMouseLeave = () => {
        setTilt({ x: 0, y: 0 });
      };

      return (
        <div
          ref={cardRef}
          className={`group transition-transform duration-200 ease-out cursor-pointer ${className}`}
          style={{ perspective: `${Math.round(maxTilt * 100)}px` }}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          onClick={onClick}
        >
          <div
            className="relative rounded-2xl transition-transform duration-200 ease-out"
            style={{ transform: `rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) translateZ(10px)` }}
          >
            <div className="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/5 to-white/10 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none" />
            {children}
          </div>
        </div>
      );
    }

    // --- 5. Modal3D Component ---
    function Modal3D({ isOpen, title = "", children, footer = null, onClose }) {
      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in"
          style={{ perspective: "1200px" }}
          onClick={onClose}
        >
          <div
            className="relative w-full max-w-lg bg-[#0F1B2D]/95 border border-white/20 rounded-3xl p-6 shadow-2xl shadow-black/80 transform transition-all duration-300 ease-out"
            style={{ transform: "rotateX(2deg) translateZ(20px)" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between pb-4 border-b border-white/10">
              <h3 className="text-xl font-bold text-white tracking-wide">{title}</h3>
              <button
                className="w-9 h-9 inline-flex items-center justify-center rounded-xl text-gray-400 hover:text-white hover:bg-white/10 transition-colors"
                onClick={onClose}
                aria-label="Close dialog"
              >
                <span className="text-xl font-bold leading-none">&times;</span>
              </button>
            </div>

            <div className="py-5 text-gray-200 overflow-y-auto max-h-[70vh]">
              {children}
            </div>

            {footer && (
              <div className="pt-4 border-t border-white/10 flex justify-end gap-3">
                {footer}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 6. BottomSheet Component ---
    function BottomSheet({ isOpen, title = "", children, peekHeight = "auto", onClose }) {
      if (!isOpen) return null;

      return (
        <div
          className="fixed inset-0 z-50 flex flex-col justify-end bg-black/70 backdrop-blur-sm animate-fade-in sm:items-center"
          onClick={onClose}
        >
          <div
            className="w-full sm:max-w-md bg-[#0F1B2D] border-t sm:border border-white/20 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl shadow-black/80 transition-transform duration-300 ease-out max-h-[85vh] flex flex-col"
            onClick={(e) => e.stopPropagation()}
            style={{ minHeight: peekHeight !== "auto" ? peekHeight : "260px" }}
          >
            <div className="w-12 h-1.5 bg-white/25 rounded-full mx-auto mb-4 cursor-grab" />
            <div className="flex items-center justify-between pb-3 mb-2 border-b border-white/10">
              <h4 className="text-lg font-bold text-white tracking-tight">{title}</h4>
              <button
                className="w-8 h-8 rounded-lg text-gray-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-colors"
                onClick={onClose}
                aria-label="Dismiss sheet"
              >
                <span className="text-lg font-bold leading-none">&times;</span>
              </button>
            </div>
            <div className="flex-1 overflow-y-auto text-gray-200 py-2">
              {children}
            </div>
          </div>
        </div>
      );
    }

    // --- 7. Chip Component ---
    function Chip({ label, variant = "default", icon = null, pulse = false, removable = false, onRemove = () => {} }) {
      const baseCls = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wide border transition-all duration-200 select-none";

      const varCls = variant === "success" ? "bg-emerald-500/15 text-emerald-300 border-emerald-500/30"
        : variant === "warning" ? "bg-amber-500/15 text-amber-300 border-amber-500/30"
        : variant === "danger" ? "bg-rose-500/15 text-rose-300 border-rose-500/30"
        : variant === "info" ? "bg-blue-500/15 text-blue-300 border-blue-500/30"
        : variant === "r1" ? "bg-[#2563EB]/20 text-[#60A5FA] border-[#2563EB]/40 font-mono"
        : variant === "r2" ? "bg-[#7C3AED]/20 text-[#C084FC] border-[#7C3AED]/40 font-mono"
        : variant === "r3" ? "bg-[#0D9488]/20 text-[#2DD4BF] border-[#0D9488]/40 font-mono"
        : variant === "ev" ? "bg-[#FFC21A]/20 text-[#FFC21A] border-[#FFC21A]/40"
        : "bg-white/10 text-gray-300 border-white/15";

      const dotColor = variant === "success" ? "bg-emerald-400"
        : variant === "warning" ? "bg-amber-400"
        : variant === "danger" ? "bg-rose-400"
        : variant === "ev" ? "bg-[#FFC21A]"
        : "bg-blue-400";

      return (
        <span className={`${baseCls} ${varCls}`}>
          {pulse && (
            <span className="relative flex h-2 w-2 mr-0.5">
              <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${dotColor}`} />
              <span className={`relative inline-flex rounded-full h-2 w-2 ${dotColor}`} />
            </span>
          )}
          {icon && <span className="inline-flex items-center text-sm">{icon}</span>}
          <span>{label}</span>
          {removable && (
            <button
              className="ml-1 -mr-1 w-4 h-4 rounded-full inline-flex items-center justify-center hover:bg-white/20 transition-colors"
              onClick={onRemove}
              aria-label="Remove tag"
            >
              <span className="text-xs font-bold leading-none">&times;</span>
            </button>
          )}
        </span>
      );
    }

    // --- 8. StatTile Component ---
    function StatTile({ label, value, subtext = "", trend = "", trendPositive = true, icon = null, color = "yellow" }) {
      const accentText = color === "yellow" ? "text-[#FFC21A]"
        : color === "green" ? "text-emerald-400"
        : color === "blue" ? "text-blue-400"
        : color === "purple" ? "text-purple-400"
        : color === "red" ? "text-rose-400"
        : "text-white";

      const glowBg = color === "yellow" ? "bg-[#FFC21A]/10 border-[#FFC21A]/30"
        : color === "green" ? "bg-emerald-500/10 border-emerald-500/30"
        : color === "blue" ? "bg-blue-500/10 border-blue-500/30"
        : color === "purple" ? "bg-purple-500/10 border-purple-500/30"
        : "bg-white/5 border-white/10";

      const trendColor = trendPositive ? "text-emerald-400" : "text-rose-400";
      const trendArrow = trendPositive ? "↑" : "↓";

      return (
        <div className={`relative p-4 rounded-2xl bg-[#0F1B2D]/80 backdrop-blur-md border ${glowBg} shadow-lg transition-transform hover:-translate-y-0.5 duration-200 overflow-hidden`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-xs font-semibold uppercase tracking-wider text-gray-400">{label}</span>
            {icon && <div className={`p-1.5 rounded-lg bg-white/5 ${accentText}`}>{icon}</div>}
          </div>
          <div className="flex items-baseline gap-2">
            <span className={`text-2xl font-black tracking-tight font-mono ${accentText}`}>{value}</span>
            {trend && (
              <span className={`text-xs font-semibold ${trendColor} flex items-center`}>
                <span>{trendArrow}</span>
                <span className="ml-0.5">{trend}</span>
              </span>
            )}
          </div>
          {subtext && <p className="mt-1 text-xs text-gray-400 font-medium truncate">{subtext}</p>}
        </div>
      );
    }

    // --- 9. Skeleton Component ---
    function Skeleton({ variant = "text", width = "100%", height = "20px", className = "" }) {
      const shapeCls = variant === "circle" ? "rounded-full" : variant === "card" ? "rounded-2xl" : variant === "rect" ? "rounded-lg" : "rounded-md";
      const actualHeight = height === "20px" && variant === "circle" ? "44px" : height;
      const actualWidth = width === "100%" && variant === "circle" ? "44px" : width;

      return (
        <div
          className={`animate-pulse bg-white/10 relative overflow-hidden ${shapeCls} ${className}`}
          style={{ width: actualWidth, height: actualHeight }}
        >
          <div className="absolute inset-0 -translate-x-full shimmer-active bg-gradient-to-r from-transparent via-white/10 to-transparent" />
        </div>
      );
    }

    // --- 10. EmptyState Component ---
    function EmptyState({ title, message, icon = null, actionLabel = "", onAction = () => {} }) {
      return (
        <div className="flex flex-col items-center justify-center text-center p-8 rounded-3xl bg-[#0F1B2D]/50 border border-white/10 backdrop-blur-md">
          <div className="w-16 h-16 mb-4 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 text-3xl shadow-inner">
            {icon || <span>∅</span>}
          </div>
          <h4 className="text-lg font-bold text-white mb-1.5">{title}</h4>
          <p className="text-sm text-gray-400 max-w-xs mb-5 leading-relaxed">{message}</p>
          {actionLabel && (
            <Button label={actionLabel} variant="primary" onClick={onAction} />
          )}
        </div>
      );
    }

    // --- 11. ErrorState Component ---
    function ErrorState({ title = "Something went wrong", message = "Please try again later.", retryLabel = "Try Again", onRetry = () => {} }) {
      return (
        <div className="flex flex-col items-center justify-center text-center p-8 rounded-3xl bg-rose-950/20 border border-rose-500/20 backdrop-blur-md">
          <div className="w-16 h-16 mb-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 text-2xl shadow-inner">
            <span>⚠️</span>
          </div>
          <h4 className="text-lg font-bold text-white mb-1.5">{title}</h4>
          <p className="text-sm text-gray-300 max-w-sm mb-5 leading-relaxed">{message}</p>
          <button
            className="inline-flex items-center justify-center font-semibold rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30 px-5 py-2.5 text-sm transition-all shadow-md cursor-pointer min-h-[44px]"
            onClick={onRetry}
          >
            <span>🔄</span>
            <span className="ml-2">{retryLabel}</span>
          </button>
        </div>
      );
    }

    // --- 12. Toast Component ---
    function Toast({ message, type = "info", isVisible = true, onClose = () => {} }) {
      if (!isVisible) return null;

      const borderCls = type === "success" ? "border-emerald-500/40 bg-emerald-950/90 text-emerald-200"
        : type === "error" ? "border-rose-500/40 bg-rose-950/90 text-rose-200"
        : type === "warning" ? "border-amber-500/40 bg-amber-950/90 text-amber-200"
        : "border-blue-500/40 bg-[#0F1B2D]/95 text-blue-200";

      const iconSymbol = type === "success" ? "✓" : type === "error" ? "✕" : type === "warning" ? "⚠" : "ℹ";

      return (
        <div className={`fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-xl max-w-sm ${borderCls}`}>
          <span className="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-xs font-bold shrink-0">
            {iconSymbol}
          </span>
          <p className="text-sm font-medium leading-snug flex-1">{message}</p>
          <button
            className="w-7 h-7 rounded-lg hover:bg-white/15 flex items-center justify-center transition-colors shrink-0 text-white/70 hover:text-white"
            onClick={onClose}
            aria-label="Dismiss toast"
          >
            <span className="text-base font-bold leading-none">&times;</span>
          </button>
        </div>
      );
    }

    // --- 13. SegmentedControl Component ---
    function SegmentedControl({ options, selectedKey, onChange, size = "md" }) {
      const padCls = size === "sm" ? "p-1 gap-1" : "p-1.5 gap-1.5";

      return (
        <div className={`inline-flex w-full items-center bg-[#0B1220]/80 border border-white/10 rounded-2xl backdrop-blur-md ${padCls}`}>
          {options.map((opt) => {
            const isSelected = opt.key === selectedKey;
            const activeCls = isSelected ? "bg-[#FFC21A] text-[#0F1B2D] shadow-md shadow-[#FFC21A]/20 scale-[1.02]" : "text-gray-400 hover:text-white hover:bg-white/5";
            return (
              <button
                key={opt.key}
                role="tab"
                aria-selected={isSelected}
                className={`flex-1 inline-flex items-center justify-center font-semibold rounded-xl transition-all duration-200 select-none min-h-[40px] px-3 py-2 text-xs sm:text-sm ${activeCls}`}
                onClick={() => onChange(opt.key)}
              >
                {opt.icon && <span className="mr-1.5">{opt.icon}</span>}
                <span>{opt.label || opt.key}</span>
                {opt.badge && isSelected && (
                  <span className="ml-1.5 px-1.5 py-0.5 rounded-full text-[10px] bg-[#0F1B2D]/20 text-[#0F1B2D] font-bold">
                    {opt.badge}
                  </span>
                )}
              </button>
            );
          })}
        </div>
      );
    }

    // --- 14. QRPanel Component ---
    function QRPanel({ qrToken, slotCode = "", vehiclePlate = "", terminalName = "", expiryText = "", verified = true }) {
      const [copied, setCopied] = useState(false);
      const statusBadgeCls = verified ? "bg-emerald-500/15 text-emerald-300 border-emerald-500/30" : "bg-amber-500/15 text-amber-300 border-amber-500/30";
      const statusText = verified ? "HMAC Authenticated Pass" : "Unsigned Mock Pass";
      const shortToken = qrToken.length > 28 ? qrToken.slice(0, 16) + "..." + qrToken.slice(-12) : qrToken;

      const handleCopy = () => {
        navigator.clipboard.writeText(qrToken);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="flex flex-col items-center p-6 rounded-3xl bg-[#0F1B2D]/90 border border-white/20 backdrop-blur-xl shadow-2xl max-w-sm mx-auto text-center">
          <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border mb-4 ${statusBadgeCls}`}>
            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
            <span>{statusText}</span>
          </div>

          <div className="p-4 bg-white rounded-2xl shadow-xl shadow-black/40 border-4 border-[#FFC21A]/60 flex flex-col items-center justify-center">
            <svg className="w-48 h-48 sm:w-56 sm:h-56 text-[#0F1B2D]" viewBox="0 0 100 100">
              <path

                      subtext="Makumbura MMC"
                      trend="84%"
                      trendPositive={true}
                      color="yellow"
                    />
                    <StatTile
                      label="Next Bus"
                      value="3.8 min"
                      subtext="Route EX1-01"
                      trend="On Time"
                      trendPositive={true}
                      color="green"
                    />
                    <StatTile
                      label="Bus Capacity"
                      value="32 / 54"
                      subtext="59.3% load"
                      trend="22 Left"
                      trendPositive={true}
                      color="blue"
                    />
                    <StatTile
                      label="EV Chargers"
                      value="3 Free"
                      subtext="50 kW DC Fast"
                      trend="Ready"
                      trendPositive={true}
                      color="purple"
                    />
                  </div>
                </section>

                {/* Section 4: Buttons, Chips & Badges */}
                <section className="space-y-4">
                  <h3 className="text-lg font-bold text-white border-b border-white/10 pb-2">
                    Buttons, Route Chips & Badges
                  </h3>
                  <div className="flex flex-wrap gap-2 items-center">
                    <Chip label="R1: Makumbura → Pettah" variant="r1" />
                    <Chip label="R2: Makumbura → Kadawatha" variant="r2" />
                    <Chip label="R3: Kesbewa → Pettah" variant="r3" />
                    <Chip label="EV Charging" variant="ev" pulse={true} />
                    <Chip label="Confirmed" variant="success" />
                    <Chip label="Heavy Traffic" variant="danger" />
                  </div>

                  <div className="flex flex-wrap gap-3 items-center pt-2">
                    <Button label="Primary Action (#FFC21A)" variant="primary" onClick={() => setIsToastOpen(true)} />
                    <Button label="Secondary Navy" variant="secondary" />
                    <Button label="Translucent Glass" variant="glass" />
                    <Button label="Ghost Action" variant="ghost" />
                    <Button label="Danger Incident" variant="danger" />
                    <IconButton icon={<span>🔍</span>} ariaLabel="Search transit network" />
                    <IconButton icon={<span>🔔</span>} ariaLabel="Notifications" badge="3" variant="primary" />
                  </div>
                </section>

                {/* Section 5: Cryptographic QR Gate Pass */}
                <section className="space-y-4">
                  <h3 className="text-lg font-bold text-white border-b border-white/10 pb-2">
                    Cryptographic HMAC QR Gate Pass
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <QRPanel
                      qrToken="eyJib29raW5nX2lkIjoiYmstOThmNDEyIiwic2xvdF9pZCI6InNsb3RfbW1jX2V2MDEifQ.7f8b9a2c3d4e5f6a1b2c3d4e5f6a7b8c"
                      slotCode="EV-01"
                      vehiclePlate="WP-CAB-4512"
                      terminalName="Makumbura Multimodal Transport Center (MMC)"
                      expiryText="Hold Window: 30 minutes until 10:15 AM"
                      verified={true}
                    />
                    <div className="space-y-3 text-sm text-gray-300 bg-[#0F1B2D]/60 p-5 rounded-3xl border border-white/10 backdrop-blur-md">
                      <h4 className="font-bold text-white text-base flex items-center gap-2">
                        <span className="text-emerald-400">🛡️</span>
                        <span>Gate Barrier Security Spec</span>
                      </h4>
                      <p className="text-xs text-gray-400 leading-relaxed">
                        Conforms to Section 2.2 of contracts.md. Tokens are signed with HMAC-SHA256 to prevent pass forgery and screenshot duplication.
                      </p>
                      <ul className="text-xs space-y-1.5 list-disc pl-4 text-gray-300">
                        <li>High contrast 56px SVG markers for 1-meter phone camera scanning</li>
                        <li>Instant single-use state transition upon barrier lift</li>
                        <li>Human-readable fallback signature for manual conductor check</li>
                      </ul>
                      <div className="pt-2">
                        <Button
                          label="Trigger Pass Verified Toast"
                          variant="glass"
                          fullWidth={true}
                          onClick={() => setIsToastOpen(true)}
                        />
                      </div>
                    </div>
                  </div>
                </section>

                {/* Section 6: Async States */}
                <section className="space-y-4">
                  <h3 className="text-lg font-bold text-white border-b border-white/10 pb-2">
                    Async States & Placeholders
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <GlassCard className="p-4 space-y-3">
                      <span className="text-xs font-semibold text-gray-400 block">Loading Skeletons</span>
                      <Skeleton variant="rect" height="40px" />
                      <Skeleton variant="text" width="80%" />
                      <Skeleton variant="text" width="60%" />
                      <div className="flex gap-2 pt-2">
                        <Skeleton variant="circle" width="36px" height="36px" />
                        <div className="flex-1 space-y-1.5">
                          <Skeleton variant="text" height="14px" />
                          <Skeleton variant="text" width="50%" height="12px" />
                        </div>
                      </div>
                    </GlassCard>

                    <EmptyState
                      title="No Buses Approaching"
                      message="There are currently no active express shuttles on Route EX1-02."
                      actionLabel="View Other Routes"
                    />

                    <ErrorState
                      title="Telemetry Offline"
                      message="Failed to reach GPS bus tracker feed. Retrying connection in 2s."
                      retryLabel="Reconnect Now"
                    />
                  </div>
                </section>

              </div>
            )}
            </div>
          </main>

          {/* Interactive Overlays */}
          <Modal3D
            isOpen={isModalOpen}
            title="Park & Ride — Makumbura Hub"
            footer={modalFooter}
            onClose={() => setIsModalOpen(false)}
          >
            {modalContent}
          </Modal3D>

          <BottomSheet
            isOpen={isSheetOpen}
            title="Bus MB-101 Telemetry & Reservation"
            onClose={() => setIsSheetOpen(false)}
          >
            {sheetContent}
          </BottomSheet>

          <Toast
            message="Parking bay EV-01 reserved successfully. QR pass active!"
            type="success"
            isVisible={isToastOpen}
            onClose={() => setIsToastOpen(false)}
          />
        </WallBackground3D>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
